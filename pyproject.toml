[project]
name = "solve_pips"
version = "1.0.0"
description = "Script to solve the NYT pip puzzles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "termcolor>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]

[tool.poe.tasks.solve]
cmd = "solve_pips.py -c"
help = "Solve pips puzzles"
